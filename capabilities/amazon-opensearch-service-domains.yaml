      path: /2021-01-01/opensearch/domain
      operations:
      - name: createdomain
        method: POST
        description: Amazon OpenSearch Service Create an OpenSearch Domain
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: 2021-01-01-opensearch-domain-info
      path: /2021-01-01/opensearch/domain-info
      operations:
      - name: describedomains
        method: POST
        description: Amazon OpenSearch Service Describe Multiple OpenSearch Domains
        outputRawFormat: json
        outputParameters:
        - name: result
