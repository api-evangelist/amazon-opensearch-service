    - name: amazon-opensearch-service-describe-opensearch
      description: Amazon OpenSearch Service Describe an OpenSearch Domain
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-opensearch-service-domains.describedomain
